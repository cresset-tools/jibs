name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # CI never debugs interactively: skipping debuginfo roughly halves compile and
  # link time and shrinks the rust-cache artifacts (applies to dev and test profiles).
  CARGO_PROFILE_DEV_DEBUG: 0
  # Incremental artifacts can't be reused across CI runs; they only add overhead
  # (and sccache skips incremental compiles entirely).
  CARGO_INCREMENTAL: 0
  # rust-cache deliberately drops workspace-crate artifacts, so jibs_parser
  # (~8 min of single-threaded chumsky monomorphization) would recompile every
  # run. sccache caches individual rustc invocations content-addressed, making
  # unchanged workspace crates near-instant cache hits.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # The default 600s idle timeout is NOT reset by in-flight compilations. When
  # jibs_parser runs alone as the final ~10min compile, the server shuts down
  # mid-compile, killing it and forcing a from-zero local restart.
  SCCACHE_IDLE_TIMEOUT: 0

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compile work from failed runs; the next attempt reuses it.
          cache-on-failure: true

      - name: Run unit tests
        run: cargo test --workspace --locked

  # macOS: unit tests plus the same client build the aarch64-apple-darwin
  # release does (embedded musl servers cross-built with zig, required by
  # JIBS_REQUIRE_EMBEDDED_SERVER), so a macOS-only break shows up before a
  # release instead of in one. No e2e here: it needs Linux docker containers.
  macos:
    name: macOS build + unit tests
    # Runs on the self-hosted Mac mini for code from this repo; fork PRs stay on
    # GitHub's runner. Set the org variable MAC_MINI_DISABLED=true to send
    # everything back to GitHub.
    runs-on: ${{ vars.MAC_MINI_DISABLED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mac-mini"]') || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: mozilla/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Install zig (cross C toolchain for the embedded server)
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cross-build embedded jibs-server binaries
        run: |
          cargo zigbuild -p jibs_server --release --locked \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl

      - name: Build client with embedded servers
        env:
          JIBS_REQUIRE_EMBEDDED_SERVER: "1"
        run: cargo build -p jibs --locked

      - name: Smoke test
        run: |
          ./target/debug/jibs --version
          ./target/debug/jibs check test/import-all.jibs

  e2e:
    name: E2E import tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Shared connection args for all import runs (word-split on use)
      JIBS_CONN: >-
        --host testuser@localhost
        --port 2222
        --identity test/ssh-keys/id_ed25519
        --no-host-key-checking
        --remote-mysql mysql://root:remote_root_pass@mysql-remote:3306/production
        --local-mysql mysql://root:local_root_pass@127.0.0.1:3308/imported
        --parallel 4
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH keys
        run: |
          ./test/setup-ssh-keys.sh
          chmod 600 test/ssh-keys/id_ed25519

      # Start containers early (no --wait) so MySQL seeds while the build runs;
      # the "Wait for test containers" step below gates on health.
      - name: Start test containers
        run: docker compose up -d

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: mozilla/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compile work from failed runs; the next attempt reuses it.
          cache-on-failure: true

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      # The client embeds the musl server binary at compile time
      # (crates/client/build.rs), so the server must be built first.
      - name: Build server (x86_64 musl)
        run: cargo zigbuild -p jibs_server --release --locked --target x86_64-unknown-linux-musl

      - name: Build client
        run: cargo build -p jibs --features test-utils --locked

      - name: Wait for test containers
        run: docker compose up -d --wait --wait-timeout 300

      - name: Aggregate import
        run: ./target/debug/jibs import test/import-aggregate.jibs $JIBS_CONN --clean

      # Every source table the config does not ignore must exist locally,
      # including one the aggregate reaches without finding a row in it
      # (order_notes) and a view (order_totals).
      - name: Verify the aggregate import created every table
        run: |
          remote=$(docker exec jibs-remote mysql -N -u root -premote_root_pass production -e "SHOW TABLES" | grep -vxE 'sessions|order_audit' | sort)
          imported=$(docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "SHOW TABLES" | sort)
          missing=$(comm -23 <(echo "$remote") <(echo "$imported"))
          if [ -n "$missing" ]; then
            echo "::error::Tables missing after the aggregate import: $missing"
            exit 1
          fi
          fks=$(docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "SELECT COUNT(*) FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA = 'imported' AND TABLE_NAME = 'order_notes'")
          if [ "$fks" != "1" ]; then
            echo "::error::order_notes lost its foreign key (got $fks)"
            exit 1
          fi

      - name: Full table import
        run: ./target/debug/jibs import test/import-all.jibs $JIBS_CONN --clean

      - name: Verify imported row counts
        run: |
          fail=0
          for tbl in users products orders order_items; do
            remote=$(docker exec jibs-remote mysql -N -u root -premote_root_pass production -e "SELECT COUNT(*) FROM $tbl")
            imported=$(docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "SELECT COUNT(*) FROM $tbl")
            echo "$tbl: remote=$remote imported=$imported"
            if [ "$remote" != "$imported" ]; then
              echo "::error::Row count mismatch for $tbl"
              fail=1
            fi
          done
          exit $fail

      # --keep-tables loads into the tables the full import above left behind:
      # a row that only exists locally survives (no table is recreated), a
      # changed row is brought back to the source's, and foreign keys and
      # triggers stay as they were. Then the same through a dump.
      - name: Import and load into existing tables (--keep-tables)
        run: |
          L() { docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "$1"; }
          shape() { L "SELECT CONCAT((SELECT COUNT(*) FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='imported'), ' fks, ', (SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='imported'), ' triggers')"; }
          check() {
            kept=$(L "SELECT COUNT(*) FROM products WHERE id = 9999")
            name=$(L "SELECT name FROM users WHERE id = 1")
            if [ "$kept" != "1" ] || [ "$name" = "stale" ] || [ "$(shape)" != "$before" ]; then
              echo "::error::$1: local-only row kept=$kept, user 1 name=$name, $(shape) (was $before)"
              exit 1
            fi
          }
          L "INSERT INTO products (id, name, sku, price) VALUES (9999, 'local only', 'LOCAL-1', 1.00)"
          before=$(shape)

          L "UPDATE users SET name = 'stale' WHERE id = 1"
          ./target/debug/jibs import test/import-all.jibs $JIBS_CONN --keep-tables
          check "import --keep-tables"

          ./target/debug/jibs import test/import-all.jibs $JIBS_CONN --dump-to "$RUNNER_TEMP/all.jibsdump"
          L "UPDATE users SET name = 'stale' WHERE id = 1"
          ./target/debug/jibs load "$RUNNER_TEMP/all.jibsdump" --local-mysql mysql://root:local_root_pass@127.0.0.1:3308/imported --parallel 4 --keep-tables
          check "load --keep-tables"

          L "ALTER TABLE users MODIFY name VARCHAR(50) NOT NULL"
          if ./target/debug/jibs import test/import-all.jibs $JIBS_CONN --keep-tables; then
            echo "::error::--keep-tables accepted a table whose column type differs from the source"
            exit 1
          fi

      # Mirrors test/test-resume.sh: seed a local-only row that a preserve rule
      # protects, crash the import so the backup table exists but the restore
      # hasn't happened, then resume.
      #
      # --fail-after-tables must equal the total checkpointed table count (the
      # 12 seed tables and views minus ignored sessions = 11): with --parallel 4 the table
      # completion order is a race, so any smaller threshold can fire before
      # users was reached, leaving no _jibs_preserve_ backup. After the last
      # checkpoint the crash is still before post-processing, so the backup
      # deterministically exists and the restore has not run.
      - name: Resume test (seed preserved row)
        run: |
          docker exec jibs-local mysql -u root -plocal_root_pass -e "
            DROP DATABASE IF EXISTS imported;
            CREATE DATABASE imported;
            USE imported;
            CREATE TABLE users (
              id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              email VARCHAR(255) NOT NULL,
              name VARCHAR(100) NOT NULL,
              password_hash VARCHAR(255),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
            INSERT INTO users (email, name, password_hash) VALUES
              ('local-admin@test.local', 'Local Admin', 'local_secret_hash');
          "

      - name: Resume test (simulated crash)
        run: |
          if ./target/debug/jibs import test/import-resume-test.jibs $JIBS_CONN --fail-after-tables 11; then
            echo "::error::Import was expected to crash after 11 tables but succeeded (did the seed schema gain tables? Keep --fail-after-tables equal to the checkpointed table count)"
            exit 1
          fi
          backup=$(docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "SHOW TABLES LIKE '_jibs_preserve_%'")
          if [ -z "$backup" ]; then
            echo "::error::Expected _jibs_preserve_ backup tables after simulated crash"
            exit 1
          fi
          echo "Crashed as expected, backup tables present: $backup"

      - name: Resume test (resume after crash)
        run: ./target/debug/jibs import test/import-resume-test.jibs $JIBS_CONN --resume

      - name: Verify resume restored state
        run: |
          leftover=$(docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "SHOW TABLES LIKE '_jibs_preserve_%'")
          if [ -n "$leftover" ]; then
            echo "::error::Backup tables still exist after resume: $leftover"
            exit 1
          fi
          preserved=$(docker exec jibs-local mysql -N -u root -plocal_root_pass imported -e "SELECT password_hash FROM users WHERE email = 'local-admin@test.local'")
          if [ "$preserved" != "local_secret_hash" ]; then
            echo "::error::Preserved row was not restored correctly (got: $preserved)"
            exit 1
          fi
          echo "Backup tables cleaned up and preserved row restored"

      - name: Dump container logs
        if: failure()
        run: docker compose logs
